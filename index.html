<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>itachi_re — Systems Enthusiast · OBS Packager</title>
    <meta
      name="description"
      content="itachi_re: systems enthusiast who packages 100+ RPMs on the openSUSE Build Service, writes practical Linux and OpenWrt guides, and tinkers with low-level Linux."
    />
    <meta name="author" content="itachi_re" />
    <link rel="canonical" href="https://itachi-re.github.io/" />

    <!-- Theme: set before first paint so there is no flash; React takes over afterwards -->
    <meta name="theme-color" content="#0d1117" />
    <meta name="color-scheme" content="dark light" />
    <style>
      html { background: #0d1117; }
      html[data-theme='light'] { background: #f6f8fa; }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('itachi-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
            document.documentElement.style.colorScheme = t;
            if (t === 'light') {
              document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f8fa');
            }
          }
        } catch (e) {}
      })();
    </script>

    <!-- Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="itachi_re" />
    <meta property="og:title" content="itachi_re — Systems Enthusiast · OBS Packager" />
    <meta
      property="og:description"
      content="100+ auto-updating RPM packages on OBS, practical Linux and OpenWrt guides, and a terminal-first workflow."

      name="twitter:description"

    />
    <meta name="twitter:image" content="https://itachi-re.github.io/og-image.png" />
